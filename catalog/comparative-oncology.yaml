  - binding-motif
  formats:
  - supplementary tables (xlsx/csv)
  - raw-ms (PRIDE)
  landing_url: https://proteomecentral.proteomexchange.org/dataset/PXD074485
  download_url: https://proteomecentral.proteomexchange.org/dataset/PXD074485
  license: CC0 (PRIDE default; per-paper supplements vary)
  license_url: https://www.proteomexchange.org/
  access: open
  provenance:
    maintainer: Multiple academic labs; raw data via PRIDE/ProteomeXchange
    key_refs:
    - 10.3389/fimmu.2016.00558
    - 10.1093/jimmun/vkag243
  last_updated: 2016-2025
  relevance:
    programs:
    - comparative
    - presentation
    - design
    why: 'The core experimental substrate for canine presentation modeling. Directly enables (and bounds)
      Veritope''s dog immuno-oncology work; everything else canine is sequence-only.

      '
  agent_access: 'Raw MS via PRIDE (bulk, CC0); motif/peptide lists via paper supplementary files (per-publisher
