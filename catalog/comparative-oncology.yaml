- id: prjeb19508-ctvt-regression-rnaseq
  name: PRJEB19508 — CTVT Regression RNA-seq (Frampton 2018)
  category: comparative-oncology
  species:
  - dog
  description: 'Bulk RNA-seq of serial biopsies from canine transmissible venereal tumours (CTVT) undergoing
    vincristine-induced and natural regression vs. non-regressing tumours. The study (Frampton et al.,
    Cancer Cell 2018) identified immune/inflammatory regression signatures and proposed CCL5 as a candidate
    driver of tumour rejection. CTVT is a naturally transmissible clonal cancer — a unique model of allogeneic
    tumour rejection and immune escape in an outbred canine host.

