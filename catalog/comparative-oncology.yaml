  description: 'The small set of primary studies that experimentally define canine MHC (DLA) peptide-binding
    motifs via MS elution - essentially the only direct canine immunopeptidomics data available. Includes
    class I (DLA-88*50101) and the first class II motifs (DLA-DRB1*015:01, DLA-DRB1*012:01), plus a canine
    tumor-antigen presentation set deposited in PRIDE.

    '
  scale: 'DLA-88*50101: ~3,720 eluted peptides (~2,436 nonamers); DLA-DR15: 838; DLA-DR12: 644; tumor
    set under PXD074485'
  modalities:
