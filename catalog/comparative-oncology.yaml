- id: icdc
  name: NCI Integrated Canine Data Commons (ICDC)
  category: comparative-oncology
  species:
  - dog
  description: 'NCI Cancer Research Data Commons (CRDC) node aggregating harmonized canine cancer data
    — clinical/biospecimen metadata, bulk RNA-seq, WGS, WES, genotyping arrays and DNA methylation — across
    spontaneous companion-dog tumors. Data come from the Comparative Oncology Program/COTC, PRECINCT,
    and individual canine researchers, structured to the ICDC data model and queryable by cohort. Current
    studies (12): COTC007B, COTC022 (appendicular osteosarcoma SOC), GLIOMA01 (comparative glioma), MGT01
    (mammary/breast), NCATS-COP01 (canine-human transcriptomics), ORGANOIDS01 (urothelial organoids),
    OSA01 (osteosarcoma multi-platform), OSA03 (human+canine osteosarcoma WGBS), TCL01 (canine cancer
    cell-line WES), UBC01 (vemurafenib in BRAF-mutant bladder cancer), UBC02 (urothelial subtypes + immune
    signatures), UC01 (urothelial WES, BRAF-V595E-negative).

    '
  scale: ~35 TB; ~11-12 studies, ~678 cases, ~937 samples (figures vary by release)
  modalities:
  - rna-seq
  - wgs
  - wes
  - methylation
  - genotyping-array
  - clinical-metadata
  - imaging
  formats:
  - bam
  - vcf
  - txt
  - json
  - api
  landing_url: https://caninecommons.cancer.gov/
  download_url: https://caninecommons.cancer.gov/#/explore
  api: https://caninecommons-api.datacommons.cancer.gov/
  license: custom (open access; use with attribution; no named SPDX license)
  license_url: https://datacommons.cancer.gov/repository/integrated-canine-data-commons
  access: open
  provenance:
    maintainer: NCI Center for Biomedical Informatics & Information Technology (CBIIT) / CRDC
    key_refs:
    - 10.1158/0008-5472.CAN-23-2730
  last_updated: '2026-06 (CRDC update: +44 COTC022 files, Data Model Navigator refresh)'
  relevance:
    programs:
    - comparative
    - presentation
    - recognition
    why: 'Primary open canine oncology multi-omics resource; anchors Veritope''s comparative strategy.
      Rich on genomics/transcriptomics but carries NO MHC-ligand, immunopeptidome or TCR data — a gap
      we must fill from elsewhere or generate ourselves.

      '
  agent_access: 'REST API + web portal; cohort building then analysis in CRDC Cloud (Seven Bridges Cancer
    Genomics Cloud). Metadata queryable programmatically; large sequence files (BAM/VCF) are cloud-hosted.
    No login for open data; no documented hard rate limits but prefer the API over scraping the Angular
    SPA (the HTML is JS-rendered and returns no content to plain fetchers).

    '
  caveats: 'No explicit SPDX license — "open access with attribution" only; confirm redistribution terms
    per study. Per-study case/sample counts not exposed on static pages (need API/portal). Portal is a
    single-page app, so direct curl of /#/explore yields no data — use the API.

    '
