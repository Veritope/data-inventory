- id: briney-2019-grp
  name: Briney 2019 baseline human antibody repertoire (Great Repertoire Project)
  category: healthy-baseline
  species:
  - human
  description: 'The largest single-study collection of human antibody heavy-chain repertoire sequences:
    UMI-corrected, deep NGS of circulating B cells from ten healthy adult donors, used to characterise
    the baseline naive/memory repertoire and estimate its diversity. Provides raw reads, UMI-consensus
    sequences and annotated consensus tables, plus synthetic (IGoR-generated) repertoires.

    '
  scale: ~3 billion raw heavy-chain reads; ~3.64e8 productive unique sequences after annotation/dedup;
    10 donors
  modalities:
  - bcr-repertoire
  - antibody-sequence
  - heavy-chain
  - synthetic-repertoire
  formats:
  - fastq
  - fasta
  - csv
  - json
  landing_url: https://github.com/brineylab/grp-paper
  download_url: https://burtonlab.s3.amazonaws.com/
  license: unknown
  license_url: https://github.com/brineylab/grp-paper/blob/master/LICENSE
  access: open
  provenance:
    maintainer: Briney lab / Burton lab, The Scripps Research Institute
    key_refs:
    - 10.1038/s41586-019-0879-y
  last_updated: '2019'
  accessions:
  - PRJNA511481
  relevance:
    programs:
    - design
    - recognition
    why: 'A clean healthy-baseline human heavy-chain repertoire for defining germline usage, CDR-H3 length
      distributions and "self-like" priors that a designed binder should respect to stay developable and
      low-immunogenicity.

      '
  agent_access: 'Direct HTTP download from a public S3 bucket (burtonlab.s3.amazonaws.com), per-subject
    links in the GitHub README. No auth. Very large: raw FASTQ ~100 GB/subject; annotated JSON up to ~1
    TB uncompressed per subject — plan for selective download of consensus FASTA / annotated CSV rather
    than raw.

    '
  caveats: 'Repository code is MIT-licensed, but the data files carry no explicit license — redistribution
    terms unconfirmed (license: unknown); attribute Briney et al. 2019. Heavy chain only, unpaired. Enormous
    footprint. PRJNA accession should be confirmed in the paper''s data-availability statement.

    '
