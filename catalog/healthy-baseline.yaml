- id: gtex
  name: Genotype-Tissue Expression Project (GTEx)
  category: healthy-baseline
  species:
  - human
  description: 'Reference of gene and isoform expression (bulk RNA-seq) across ~54 non-diseased tissue
    sites from nearly 1000 post-mortem donors, with matched genotype for eQTL/sQTL analysis. The flagship
    normal-tissue transcriptome baseline for defining where a gene is and is not expressed across the
    healthy human body. V10 is the current release; V11 re-annotates V10 against GENCODE 47 without new
    samples.

    '
