    maintainer: NIH Common Fund GTEx Consortium (Broad Institute LDACC; portal hosted by Broad)
    key_refs:
    - 10.1126/science.aaz1776
    - 10.1038/ng.2653
  last_updated: 2024-11 (V10 open-access release)
  relevance:
    programs:
    - presentation
    - design
    - comparative
