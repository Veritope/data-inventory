    hosted on AnVIL/Terra (egress fees apply).

    '
  caveats: 'Post-mortem tissue (RIN/ischemia effects). Only summary expression is open; raw reads and
    genotypes are controlled-access via dbGaP — do not assume bulk fetch of individual-level data. No
    canine data. Portal terms, not a named CC license; cite the consortium.

    '
