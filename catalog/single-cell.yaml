- id: 10x-tcr-pmhc-dextramer
  name: 10x Genomics TCR-pMHC dextramer datasets ("A New Way of Exploring Immunity")
  category: single-cell
  species:
  - human
  description: 'Single-cell 5'' immune profiling of CD8+ T cells from four healthy donors, each labeled
    with ~44-50 dCODE Dextramer (pMHC) reagents plus TotalSeq-C surface-protein antibodies, giving paired
    alpha/beta TCR sequences with per-cell pMHC binding calls and gene expression.

    '
  scale: ~62,858 cells, ~14,320 distinct pMHC-specific paired TCRs (application note); 4 donors
  modalities:
  - paired-chain
  - pmhc-dextramer
  - scrna-seq
  - cite-seq
  formats:
  - csv
  - cellranger
  - h5
  landing_url: https://www.10xgenomics.com/resources/datasets/cd-8-plus-t-cells-of-healthy-donor-1-1-standard-3-0-2
  download_url: https://www.10xgenomics.com/resources/datasets/cd-8-plus-t-cells-of-healthy-donor-1-1-standard-3-0-2
  license: CC BY 4.0
  license_url: https://creativecommons.org/licenses/by/4.0/
  access: registration
  provenance:
    maintainer: 10x Genomics
    key_refs:
    - 10x Genomics Application Note AN047
  last_updated: '2019'
  relevance:
    programs:
    - recognition
    - design
    why: 'The canonical paired-chain, single-cell pMHC-binding dataset underpinning modern TCR specificity
      models and most published negative/positive splits (NetTCR, pMTnet).

      '
  agent_access: 'Per-donor dataset pages host binarized CSV matrices and Cell Ranger outputs behind a
    short registration/EULA click-through; direct file URLs are fetchable once accepted.

    '
  caveats: 'Dextramer binding has nonspecific background; standard practice applies UMI>10 and >5x negative-control
    filters and drops cells with >4 specificities. CC BY 4.0 is ML/redistribution friendly (cite). Human
    only.

    '
