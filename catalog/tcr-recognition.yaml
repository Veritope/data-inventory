- id: airr-data-commons
  name: AIRR Data Commons (ADC) + iReceptor
  category: tcr-recognition
  species:
  - human
  - mouse
  - other
  description: 'Federated network of repositories serving AIRR-standard adaptive immune receptor repertoire
    (TCR/BCR-seq) data through a common query API; iReceptor is a gateway over it. A standardized programmatic
    layer for pulling repertoire data across many studies.

    '
  scale: billions of annotated sequences across federated repositories
  modalities:
  - tcr-seq
  - bcr-seq
  - repertoire
  - airr-rearrangement
  formats:
  - airr-tsv
  - json
  - api
  landing_url: https://docs.airr-community.org/en/stable/api/adc.html
  download_url: https://gateway.ireceptor.org/
  api: https://docs.airr-community.org/en/stable/api/adc_api.html
  license: API spec CC BY 4.0; per-repository/study data terms vary
  license_url: https://docs.airr-community.org/
  access: open
  provenance:
    maintainer: AIRR Community (AInBev/iReceptor; multiple hosts)
    key_refs:
    - 10.3389/fdata.2020.00022
  last_updated: ADC API v1 (2020), ongoing
  relevance:
    programs:
    - recognition
    - comparative
    why: 'Standardized cross-repository access to large repertoire datasets — background/negative TCR
      distributions and disease-associated repertoires for recognition modeling.

      '
  agent_access: 'PROGRAMMATIC: ADC API (uniform JSON query/download) across all member repositories; iReceptor
    gateway exports sequences/clones/cells in AIRR TSV. One query spans many repositories. Highly automatable,
    no auth for public data.

    '
  caveats: 'API spec is CC BY 4.0 but underlying per-study data licenses are not centralized — check per
    repository/study before redistribution/ML use. Repertoire data is mostly specificity- agnostic (bulk)
    — pair with VDJdb/MIRA for labels.

    '
- id: bentzen-2016-dna-barcoded-multimers
  name: DNA-barcoded peptide-MHC-I multimer screen (Bentzen 2016)
  category: tcr-recognition
  species:
  - human
  description: 'The founding dataset for DNA-barcode-labelled pMHC-I multimers, enabling simultaneous
    detection of >1,000 peptide specificities per sample by sequencing the barcodes of bound multimers.
    Release includes the barcode-labelled multimer panels (e.g. a 1,031- specificity panel and a 110-specificity
    panel) and the T-cell screening readouts as supplementary tables.

    '
  scale: '>1,000 pMHC specificities per sample; 1,031- and 110-plex barcoded multimer panels'
  modalities:
  - pmhc-multimer
  - tcr-epitope
  - barcode-seq
  formats:
  - xlsx
  - pdf
  landing_url: https://www.nature.com/articles/nbt.3662
  download_url: https://www.nature.com/articles/nbt.3662#Sec30
  license: unknown
  license_url: https://www.nature.com/nature/editorial-policies
  access: open
  provenance:
    maintainer: Bentzen, Marquard, Hadrup et al. (DTU / Herlev Hospital)
    key_refs:
    - 10.1038/nbt.3662
  last_updated: 2016-08
  relevance:
    programs:
    - recognition
    why: 'The method and data that scaled antigen-specific T-cell detection beyond fluorescent multimers;
      a large pMHC-specificity screen independent of the 10x dextramer releases, useful for TCR-antigen
      pairing benchmarks.

      '
  agent_access: 'Supplementary Excel tables on the Nature Biotechnology article page (no auth for SI).
    No separate GEO/Zenodo repository was deposited.

    '
  caveats: 'Data only as journal SI under Springer Nature terms (no open license). Barcode panels describe
    reagents/specificities, not necessarily paired-TCR sequences.

    '
- id: birnbaum-pmhc-yeast-display
  name: pMHC yeast-display library screens (Birnbaum/Garcia lineage)
  category: tcr-recognition
  species:
  - human
  - mouse
  description: 'Deep-sequencing outputs of yeast-displayed peptide-MHC library selections against defined
    TCRs: large sets of peptides recovered (and depleted) over affinity-selection rounds, used to map
    TCR cross-reactivity landscapes. Method family includes YAMTAD and newer pMHC-pseudotyped-virus variants
    (e.g. VelociRAPTR).

    '
  scale: 'per-TCR: 10^6-10^9 library members screened; thousands of recovered peptides/TCR'
  modalities:
  - pmhc-library
  - deep-sequencing-selection
  - tcr-crossreactivity
  formats:
  - fastq
  - csv
  - supplementary-tables
  landing_url: https://www.cell.com/fulltext/S0092-8674(14)00476-0
  download_url: https://www.ncbi.nlm.nih.gov/geo/
  license: per-publication (supplementary data / journal terms); varies
  license_url: unknown
  access: open
  provenance:
    maintainer: Birnbaum / K.C. Garcia labs (and successors)
    key_refs:
    - 10.1016/j.cell.2014.03.047
    - 10.1038/s41421-022-00386-2
    - 10.1101/2025.08.25.671738
  last_updated: 2014-2025 (multiple studies)
  relevance:
    programs:
    - recognition
    - design
    why: 'Exhaustive per-TCR cross-reactivity maps are uniquely informative for modeling TCR specificity
      breadth and for de novo antigen/TCR design.

      '
  agent_access: 'No single portal — data live as journal supplementary tables and per-study GEO/SRA deposits
    (fetch via GEO/SRA APIs using accessions cited in each paper). Requires per-paper discovery; not a
    unified API.

    '
  caveats: 'Fragmented across publications; accessions and licenses vary per paper and some have no explicit
    data license — treat license as unknown and check each source. Selection-based read counts are enrichment
    signals, not calibrated affinities. Deduplicate/normalize across studies.

    '
