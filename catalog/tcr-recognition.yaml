  category: tcr-recognition
  species:
  - human
  - mouse
  description: 'Portal of published TCR-beta (immunoSEQ) bulk repertoire projects released alongside papers,
    spanning cancer, infection, autoimmunity and healthy cohorts. Very large collection of deeply sequenced
    human TCRB repertoires.

    '
  scale: hundreds of projects; billions of TCRB rearrangements aggregate
  modalities:
  - cdr3-beta
  - repertoire
  - bulk-tcrseq
  formats:
  - tsv
  landing_url: https://clients.adaptivebiotech.com/immuneaccess
  download_url: https://clients.adaptivebiotech.com/immuneaccess
  license: custom — 'For Research Use Only' (immuneACCESS Terms of Use)
  license_url: https://clients.adaptivebiotech.com/terms-of-use
  access: registration
  provenance:
    maintainer: Adaptive Biotechnologies
    key_refs:
    - 10.1038/ng.2664
  last_updated: ongoing
  relevance:
    programs:
    - recognition
    - comparative
    why: 'Deepest public human TCRB repertoires; valuable for background/negative modeling and disease-cohort
      context, but terms constrain how we may reuse/redistribute.

      '
  agent_access: 'Account/registration required to download; data pulled per-project as TSV via the portal
    (no open API). Scriptable only after login and per-project EULA acceptance.

    '
  caveats: 'RED FLAG — bespoke "For Research Use Only" Terms of Use; redistribution, commercial use and
    ML/model-training permissions are not openly stated and are likely restricted. Could not retrieve
    the full clause text (JS-rendered terms page) — must be reviewed manually before any reuse/republication.
    TCRB only (no paired chains), not antigen-labeled. No dog.

    '
