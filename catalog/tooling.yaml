  agent_access: 'PROGRAMMATIC: SRA Toolkit (prefetch/fasterq-dump) reads directly from AWS/GCP buckets;
    full corpus mirrored on AWS + GCP Open Data; metadata queryable via BigQuery (GCP) and Athena (AWS)
    for SQL-style discovery. Cloud Data Delivery Service copies originals to your bucket. Highly automatable.

    '
  caveats: 'Egress/compute costs when pulling from cloud outside the hosting region. Controlled human
