    and post-translational-modification interactions, drawn from the primary literature and high-throughput
    datasets. Interactions are evidence-typed and experiment- attributed.

    '
  scale: '>2.9M protein/genetic interactions, >1M chemical interactions, ~80k publications'
  modalities:
  - physical-interaction
  - genetic-interaction
  - ptm
  - chemical-interaction
  formats:
  - tab
  - tab2
  - mitab
  - biogrid-json
  - psi-mi-xml
  landing_url: https://thebiogrid.org/
  download_url: https://downloads.thebiogrid.org/BioGRID
  api: https://wiki.thebiogrid.org/doku.php/biogridrest
  license: MIT
  license_url: https://downloads.thebiogrid.org/BioGRID
  access: open
  provenance:
    maintainer: BioGRID team (Princeton, Mount Sinai Toronto, others)
    key_refs:
    - 10.1002/pro.3978
    - 10.1093/nar/gkj109
  last_updated: 2025 (monthly releases, e.g. 4.4.x)
  relevance:
    programs:
    - presentation
    - recognition
    - design
    - comparative
    why: 'MIT-licensed (commercially usable) curated physical/genetic interaction edges for building interaction
      features around antigen-processing and immune-signaling proteins; PTM interactions add regulatory
      detail.

      '
  agent_access: 'Open bulk downloads (TAB2/MITAB/PSI-MI, monthly archives) under MIT; REST API with a
    free access key. Fully automatable and redistributable with attribution.

    '
  caveats: 'Data are MIT (free for commercial + academic, cite Stark 2006 + Oughtred 2021); the article
    text is CC BY 4.0 — keep separate. Curation is literature-driven, so coverage is biased toward well-studied
    proteins; dog interactions are sparse.

    '
- id: bv-brc-epitopes
  name: BV-BRC viral/bacterial epitope features (ex-ViPR / ex-IRD)
  category: reference
  species:
  - human
  - other
  description: 'The epitope feature data within the Bacterial and Viral Bioinformatics Resource Center
    (BV-BRC), which consolidated the legacy Virus Pathogen Resource (ViPR), Influenza Research Database
    (IRD) and PATRIC. Epitope records (originally sourced from IEDB and mapped onto BV-BRC pathogen proteins/genomes)
    link experimentally characterized T- and B-cell epitopes to viral strains, surface glycoproteins and
    genome coordinates — useful for infectious-disease and vaccine epitope selection (influenza, flaviviruses,
    coronaviruses, etc.).

    '
  scale: Epitope features across thousands of viral/bacterial pathogen genomes; IEDB-sourced, strain-mapped
  modalities:
  - tcr-epitope
  - antibody-epitope
  - pathogen-genome-annotation
  formats:
  - csv
  - json
  - api
  - ftp
  landing_url: https://www.bv-brc.org/
  download_url: https://www.bv-brc.org/docs/system_documentation/data_management_sharing.html
  api: https://www.bv-brc.org/api/
  license: custom (all public data freely available without restriction; code MIT)
  license_url: https://www.bv-brc.org/docs/system_documentation/data_management_sharing.html
  access: open
  provenance:
    maintainer: BV-BRC (NIAID-funded; University of Chicago / Argonne / J. Craig Venter Institute et al.)
    key_refs:
    - 10.1093/nar/gkac1003
  last_updated: '2023'
  relevance:
    programs:
    - recognition
    - presentation
    why: 'Strain- and structure-mapped infectious-disease/vaccine epitope context not readily available
      from IEDB alone; useful for pathogen-mimicry analyses and vaccine-antigen selection.

      '
  agent_access: 'Public data "freely available without restriction"; access via website, data API, CLI
    and FTP. No auth for public data. Fully agent-fetchable.

    '
  caveats: 'The epitope records are IEDB-derived (already-catalogued IEDB is the upstream source) — BV-BRC
    adds pathogen/strain mapping, not new assays. Any downstream reuse of the epitope evidence should
    respect IEDB''s own terms. Code is MIT; "data freely available" is BV-BRC''s own statement (no SPDX
    tag) — verify for commercial redistribution.

    '
- id: cab-rep
  name: cAb-Rep (Curated Antibody Repertoires)
  category: reference
  species:
  - human
  description: 'A curated database of full-length, IgBLAST-annotated human antibody variable (IGH, IGK,
    IGL) repertoires assembled to study antibody diversity and to estimate the prevalence of a given antibody
    lineage across donors. Each transcript carries V/D/J gene usage, isotype and somatic-hypermutation
    annotation. Useful for asking how "public"/recurrent a designed or isolated antibody is.

    '
  scale: 306 Ig repertoires from 121 human donors; ~267.9M heavy-chain and ~72.9M light-chain transcripts
  modalities:
  - bcr-repertoire
  - antibody-sequence
  - unpaired-chain
  formats:
  - fasta
  landing_url: https://cab-rep.c2b2.columbia.edu/
  download_url: https://cab-rep.c2b2.columbia.edu/
  license: unknown
  license_url: unknown
  access: open
  provenance:
    maintainer: Shapiro lab, Columbia University (C2B2)
    key_refs:
    - 10.3389/fimmu.2019.02365
  last_updated: '2019'
  relevance:
    programs:
    - recognition
    - design
    why: 'Donor-resolved human repertoires let you score the natural prevalence and germline plausibility
      of candidate antibody sequences, a useful prior for the design program and for interpreting recognition
      breadth.

      '
  agent_access: 'Web resource; repertoires provided as FASTA. No documented API; expect to download per-donor/per-repertoire
