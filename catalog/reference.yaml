- id: uniref
  name: UniRef (UniProt Reference Clusters — UniRef100/90/50)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'Non-redundant clustered views of UniProtKB (plus selected UniParc records). UniRef100
    merges identical sequences and sub-fragments; UniRef90 and UniRef50 cluster at 90% and 50% sequence
    identity respectively, each represented by a single seed sequence. UniRef50/90 are the de facto pretraining
    corpora for protein language models (ESM-1b/ESM-2 sample evenly across UniRef50 clusters; ProtTrans
    used UniRef100/UniRef50), because clustering removes the massive redundancy of raw UniProtKB while
    preserving sequence diversity.

