  - api
  - cytoscape
  landing_url: https://string-db.org/
  download_url: https://string-db.org/cgi/download
  api: https://string-db.org/help/api/
  license: CC BY 4.0
  license_url: https://string-db.org/cgi/access
  access: open
  provenance:
    maintainer: STRING Consortium (EMBL, SIB, UZH, NNF-CPR; Bork/von Mering/Jensen labs)
    key_refs:
    - 10.1093/nar/gkac1000
  last_updated: 2026 (v12.5 current; v12.0 archived)
  relevance:
    programs:
    - presentation
    - recognition
    - design
    - comparative
    why: 'Network features (association scores, neighbors) for propagating annotation, building protein-interaction
      features around antigen/immune genes, and cross-species transfer via orthology — dog-genome coverage
      supports the comparative program.

      '
  agent_access: 'Open bulk per-organism flat-file downloads (CC BY 4.0), no auth; REST API with rate limits
    for targeted queries. Pin a version (per-version archived sites).

    '
  caveats: 'Associations are predicted/integrated (incl. text-mining) — not all edges are physical interactions;
    filter by evidence channel and confidence score. Very large per-organism files. v12.0 is archived
    at a versioned subdomain; current live is v12.5.

    '
- id: uniparc
  name: UniParc (UniProt Archive)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'A comprehensive, non-redundant sequence archive that stores every protein sequence ever
    submitted to UniProt''s source databases, tracking each unique sequence with a stable UPI and full
    provenance/cross-references, including sequences no longer in UniProtKB. It is the broadest single
    protein-sequence superset UniProt offers and a candidate source for maximally diverse pretraining
    corpora (at the cost of including obsolete/low-quality entries).

    '
  scale: '>900M unique sequences (UPIs), release-dependent — broadest UniProt sequence set'
  modalities:
  - protein-sequence
  formats:
  - fasta
  - xml
  landing_url: https://www.uniprot.org/help/uniparc
  download_url: https://ftp.uniprot.org/pub/databases/uniprot/current_release/uniparc/
  api: https://rest.uniprot.org/uniparc/
  license: CC BY 4.0
  license_url: https://www.uniprot.org/help/license
  access: open
  provenance:
    maintainer: UniProt Consortium (EMBL-EBI, SIB, PIR)
    key_refs:
    - 10.1093/nar/gkae1010
  last_updated: 2025 (UniProt release cadence)
  relevance:
    programs:
    - design
    why: 'Superset sequence archive for building maximally diverse PLM pretraining corpora or for recovering
      sequences dropped from UniProtKB; useful when corpus breadth matters more than curation.

      '
  agent_access: 'Open FTP bulk download (very large XML/FASTA), no auth. REST API at rest.uniprot.org/uniparc
    for targeted lookups; bulk FTP for corpus-scale use.

    '
  caveats: 'Includes obsolete, redundant-source, and low-quality sequences by design (archive, not a curated
    KB) — heavy cleaning/clustering needed before training. Very large downloads. Deduplicate against
    UniRef/UniProtKB.

    '
- id: uniprot
