    - recognition
    - design
    - comparative
    why: 'The reference "self" proteome for both human and dog — the search database against which MS
      immunopeptidomes are identified and the self-filter for candidate neoantigens/epitopes. Isoform
      and PTM annotation supports distinguishing variant vs. canonical sequence.

      '
  agent_access: 'REST API at rest.uniprot.org (no auth) with proteomes, uniprotkb, and ID-mapping endpoints,
    content negotiation to FASTA/JSON/TSV; bulk reference-proteome FASTA via FTP. Fully scriptable.

    '
  caveats: 'CC BY 4.0 (ignore stale "NoDerivs" claims on third-party pages). TrEMBL is unreviewed — prefer
    Swiss-Prot + canonical for a clean self set. Canine proteome is less deeply curated than human; many
    entries are TrEMBL-level.

    '
- id: uniref
  name: UniRef (UniProt Reference Clusters — UniRef100/90/50)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'Non-redundant clustered views of UniProtKB (plus selected UniParc records). UniRef100
    merges identical sequences and sub-fragments; UniRef90 and UniRef50 cluster at 90% and 50% sequence
    identity respectively, each represented by a single seed sequence. UniRef50/90 are the de facto pretraining
    corpora for protein language models (ESM-1b/ESM-2 sample evenly across UniRef50 clusters; ProtTrans
    used UniRef100/UniRef50), because clustering removes the massive redundancy of raw UniProtKB while
    preserving sequence diversity.

    '
  scale: UniRef90 ~190M clusters; UniRef50 ~60M clusters (release-dependent); UniRef100 >400M entries
  size_bytes: 116000000000
  modalities:
  - protein-sequence
  - sequence-clusters
  formats:
  - fasta
  - xml
  landing_url: https://www.uniprot.org/help/uniref
  download_url: https://ftp.uniprot.org/pub/databases/uniprot/uniref/
  api: https://rest.uniprot.org/uniref/
  license: CC BY 4.0
  license_url: https://www.uniprot.org/help/license
  access: open
  provenance:
    maintainer: UniProt Consortium (EMBL-EBI, SIB, PIR)
    key_refs:
    - 10.1093/bioinformatics/btu739
    - 10.1093/nar/gkae1010
  last_updated: 2025 (UniProt release cadence ~8x/yr)
  relevance:
    programs:
    - design
    why: 'Primary pretraining corpus for protein language models underpinning representation learning
      and sequence-based design. UniRef50/90 give diversity-balanced sequence sets without the redundancy
      of raw UniProtKB.

      '
  agent_access: 'Open FTP bulk download (FASTA + XML) of full UniRef100/90/50 flat files, no auth. REST
    API at rest.uniprot.org/uniref with pagination; bulk download strongly preferred over API for corpora.

    '
  caveats: 'Overlaps the combined ''uniprot'' entries (domain-5, domain-9) which bundle UniRef mention;
    this entry is the dedicated pretraining-corpus view. Cluster counts change every release — verify
    against release notes. CC BY requires attribution; a few legacy mirrors still cite old CC BY-NC terms
    (superseded). Deduplicate against UniParc/UniProtKB if combining corpora.

    '
