- id: afnd
  name: Allele Frequency Net Database (AFND)
  category: reference
  species:
  - human
  description: 'A repository of HLA (and KIR, MIC, cytokine) allele, genotype, and haplotype frequencies
    across worldwide populations, with a gold-standard data classification. Used to weight/prioritize
    alleles by population prevalence.

    '
  scale: Thousands of population samples across 8 HLA genes (+KIR/MIC/cytokine); millions of typings
  modalities:
  - allele-frequency
  - haplotype-frequency
  formats:
  - html
  - tsv
  landing_url: https://www.allelefrequencies.net/
  download_url: https://www.allelefrequencies.net/hla.asp
  license: unknown
  access: open
  provenance:
    maintainer: University of Liverpool (Andrew R. Jones et al.)
    key_refs:
    - 10.1093/nar/gkz1029
  last_updated: ongoing
  relevance:
    programs:
    - presentation
    - design
    why: 'Population allele frequencies decide which HLA alleles to prioritize for population coverage
      in presentation/design (shared-antigen vaccine or TCR design).

      '
  agent_access: 'Native access is paginated HTML tables (scrape-only, no clean bulk API) - a real friction
    point for agents. Community mirrors exist: slowkow/allelefrequencies (single afnd.tsv, MIT-licensed
    repo) and the HLAfreq Python package automate download/combination. Prefer those for bulk pulls.

    '
  caveats: 'AFND''s own site has "Licensing" and "Disclaimer" pages that were not retrievable at catalog
    time - data license marked unknown; confirm before redistribution. AFND asks you to also cite the
    ORIGINAL publication of each dataset used. Community mirror''s MIT license covers the repo/code, not
    the underlying frequencies.

    '
- id: antiref
  name: AntiRef (reference clusters of human antibody sequences)
  category: reference
  species:
  - human
  description: 'Non-redundant reference clusters of human antibody sequences derived by clustering large
    public repertoire data at multiple identity thresholds, analogous to UniRef for antibodies. Provides
    representative sequences that collapse the massive redundancy of raw repertoires into tractable, deduplicated
    reference sets for search and model training.

    '
  scale: Clustered sets at several identity thresholds (e.g. 100/90/.../50% id); tens of millions of representatives
    depending on threshold
  modalities:
  - bcr-repertoire
  - antibody-sequence
  - sequence-clusters
  formats:
  - fasta
  landing_url: https://github.com/brineylab/antiref
  download_url: https://github.com/brineylab/antiref
  license: unknown
  license_url: unknown
  access: open
  provenance:
    maintainer: Briney lab, The Scripps Research Institute
    key_refs:
    - 10.1093/bioadv/vbad109
  last_updated: '2023'
  relevance:
    programs:
    - design
    - recognition
    why: 'Deduplicated antibody reference sets give cleaner training/search corpora than raw repertoires,
      reducing sampling bias when pretraining antibody models or searching for natural analogues of a
      designed binder.

      '
  agent_access: 'Distributed via GitHub with downloadable FASTA cluster files (hosted on public object
    storage per the repo). No auth. Scriptable.

    '
  caveats: 'No explicit data license surfaced — treat as unconfirmed (license: unknown) and attribute
    Briney 2023. Human only; derived product (clustering choices affect downstream stats). Unpaired.

    '
- id: barkbase
  name: BarkBase — Canine Epigenomic Annotation
  category: reference
  species:
  - dog
  description: 'Epigenomic reference for the dog: RNA-seq, WGS and ATAC-seq across 27 adult tissues (with
    replicates) plus staged embryonic timepoints, with a download portal. Foundational for regulatory
    annotation of the canine genome.

    '
  scale: 27 adult tissues + embryonic timepoints; 37/46 ATAC-seq libraries passed QC
  modalities:
  - rna-seq
  - atac-seq
  - wgs
  formats:
  - bam
  - bigwig
  - bed
  - fastq
  landing_url: http://www.barkbase.org/
  download_url: http://www.barkbase.org/
  license: unknown (portal download; SRA raw reads public-domain norms)
  license_url: https://doi.org/10.3390/genes10060433
  access: open
  provenance:
    maintainer: Broad Institute / UMass Chan (Karlsson/Megquier)
    key_refs:
    - 10.3390/genes10060433
  last_updated: '2019'
  relevance:
    programs:
    - comparative
    - presentation
    why: 'Tissue-level regulatory annotation helps interpret expression context of tumor antigens; a baseline
      for "self" expression used in neoantigen filtering.

      '
  agent_access: 'Portal downloads + SRA raw reads (project IDs in supp. Table S1); no auth.

    '
  caveats: 'ATAC-seq quality limited (many samples FRiP <0.3, below ENCODE threshold); not ENCODE-depth.
    No MHC/immune-specific layer. License not explicitly stated.

    '
- id: bfd
  name: Big Fantastic Database (BFD)
  category: reference
  species:
  - other
  description: 'One of the largest publicly available clustered protein-sequence databases, built for
    deep MSA generation in AlphaFold2. Contains 65,983,866 protein families as MSAs and profile HMMs covering
    ~2.2 billion sequences, clustered at 30% identity / 90% coverage from UniProt, Metaclust, the Soil
    Reference Catalog and the Marine Eukaryotic Reference Catalog (~2.5B input sequences).

    '
  scale: 65,983,866 families / clusters; ~2,204,359,010 clustered sequences (~2.5B input)
  size_bytes: 291649557441
  modalities:
  - protein-sequence
  - msa
  - hmm
  - sequence-clusters
  formats:
  - fasta
  - a3m
  - hhm
  landing_url: https://bfd.mmseqs.com/
  download_url: https://bfd.mmseqs.com/bfd_metaclust_clu_complete_id30_c90_final_seq.sorted_opt.tar.gz
  license: CC BY 4.0
  license_url: https://bfd.mmseqs.com/
  access: open
  provenance:
    maintainer: Steinegger / Mirdita / Söding (Söding Lab, MMseqs2 ecosystem); produced for AlphaFold
    key_refs:
    - 10.1038/s41586-021-03819-2
    - 10.1038/s41467-018-04964-5
  last_updated: 2021 (frozen AlphaFold2 release build)
  relevance:
    programs:
    - design
    why: 'Massive clustered metagenome-inclusive corpus for deep MSA construction and large-scale PLM
      pretraining; reaches far beyond UniProt into environmental sequence space relevant to novel-fold
      and representation learning.

      '
  agent_access: 'Direct HTTP(S) bulk download (Google Cloud and GWDG mirrors); ~272 GiB tarball, aria2c
    recommended. No auth. Plan for very large disk/RAM footprint.

    '
  caveats: 'Frozen 2021 build (not updated). Enormous download. Derived inputs include Metaclust, which
    is CC BY-NC-SA (see metaclust entry) — BFD itself is released CC BY 4.0, but confirm downstream terms
    if redistributing derivatives. Clusters with <3 sequences removed.

    '
