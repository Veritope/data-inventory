  - other
  description: 'Weekly, fully automated blind benchmark that evaluates structure (and other) prediction
    servers on soon-to-be-released PDB targets. Provides continuous, ongoing held-out assessment data
    complementing the biennial CASP.

    '
  scale: Weekly targets since 2012 (rolling archive of predictions + scores)
  modalities:
  - sequence
  - reference-structure
  - predictions
  - assessment-scores
  formats:
  - pdb
  - json
  - csv
  landing_url: https://www.cameo3d.org/
  download_url: https://www.cameo3d.org/
  license: CC BY-SA 4.0
  license_url: https://cameo3d.org/cameong_terms/
  access: open
  provenance:
    maintainer: Schwede group, SIB / Biozentrum Basel
    key_refs:
    - 10.1002/prot.25431
  last_updated: 2025 (weekly)
  relevance:
    programs:
    - design
    - presentation
    why: 'Continuous, low-leakage evaluation stream for monitoring folding-model performance on fresh
