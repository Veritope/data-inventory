  name: SNP2HLA / T1DGC Immunochip HLA imputation reference panel
  category: reference
  species:
  - human
  description: 'The classic European-ancestry HLA imputation reference panel built by the Type 1 Diabetes
    Genetics Consortium (T1DGC) and distributed with the SNP2HLA tool. Contains ~5,868 MHC-region SNPs
    (Illumina Immunochip) phased with four-digit classical HLA types and HLA amino-acid polymorphisms
    for ~5,225 unrelated individuals, enabling imputation of classical alleles and amino-acid variants
    from SNP data. The companion Pan-Asian panel ships inside the SNP2HLA v1.0.3 package.

    '
  scale: ~5,225 unrelated individuals; ~5,868 MHC SNPs + 4-digit HLA + amino-acid polymorphisms (T1DGC
    panel)
  modalities:
  - hla-reference-panel
  - snp-genotype
  - hla-allele
  - hla-amino-acid
  formats:
  - plink
  - beagle
  - bgl
  - markers
  landing_url: https://software.broadinstitute.org/mpg/snp2hla/
  download_url: https://software.broadinstitute.org/mpg/snp2hla/
  license: unknown
  license_url: https://software.broadinstitute.org/mpg/snp2hla/
  access: controlled-access
  provenance:
    maintainer: Broad Institute (de Bakker lab) + Type 1 Diabetes Genetics Consortium (T1DGC)
    key_refs:
    - 10.1371/journal.pone.0064683
  last_updated: 2015-03
  relevance:
    programs:
    - presentation
    - recognition
    why: 'Foundational reference panel for turning cheap SNP-array genotypes into 4-digit HLA + amino-acid
      calls; the baseline that newer multi-ethnic panels (Luo 2021, CookHLA) are benchmarked against.

      '
  agent_access: 'SNP2HLA tool + Pan-Asian panel: direct download, no auth. T1DGC panel: NOT in the package
    since v1.0.3 (removed for individual-genotype privacy reasons) — must be requested from the NIDDK
    Central Repository with an application; not agent-fetchable.

    '
  caveats: 'RED FLAG: the core European T1DGC reference panel is no longer openly downloadable — it was
    pulled from the SNP2HLA distribution over individual-level genotype privacy and is now controlled-access
    via NIDDK (DUA/request). No explicit SPDX license on the tool page. European-ancestry panel (ancestry
    bias). Only the Pan-Asian panel remains openly bundled.

    '
- id: string
  name: STRING (Search Tool for the Retrieval of Interacting Genes/Proteins)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'Database of known and predicted protein-protein associations (functional and physical),
    scored and integrated from experiments, co-expression, text-mining, databases and genomic context,
    with confidence scores. Includes a functional-enrichment service. Covers thousands of organisms including
    dog.

    '
  scale: '>12,000 organisms, >59M proteins, >20B interactions (v12)'
  modalities:
