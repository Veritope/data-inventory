- id: afnd
  name: Allele Frequency Net Database (AFND)
  category: reference
  species:
  - human
  description: 'A repository of HLA (and KIR, MIC, cytokine) allele, genotype, and haplotype frequencies
    across worldwide populations, with a gold-standard data classification. Used to weight/prioritize
    alleles by population prevalence.

    '
  scale: Thousands of population samples across 8 HLA genes (+KIR/MIC/cytokine); millions of typings
  modalities:
  - allele-frequency
  - haplotype-frequency
  formats:
  - html
  - tsv
  landing_url: https://www.allelefrequencies.net/
  download_url: https://www.allelefrequencies.net/hla.asp
  license: unknown
  access: open
  provenance:
    maintainer: University of Liverpool (Andrew R. Jones et al.)
    key_refs:
    - 10.1093/nar/gkz1029
  last_updated: ongoing
  relevance:
    programs:
    - presentation
    - design
    why: 'Population allele frequencies decide which HLA alleles to prioritize for population coverage
      in presentation/design (shared-antigen vaccine or TCR design).

      '
  agent_access: 'Native access is paginated HTML tables (scrape-only, no clean bulk API) - a real friction
    point for agents. Community mirrors exist: slowkow/allelefrequencies (single afnd.tsv, MIT-licensed
    repo) and the HLAfreq Python package automate download/combination. Prefer those for bulk pulls.

    '
  caveats: 'AFND''s own site has "Licensing" and "Disclaimer" pages that were not retrievable at catalog
    time - data license marked unknown; confirm before redistribution. AFND asks you to also cite the
    ORIGINAL publication of each dataset used. Community mirror''s MIT license covers the repo/code, not
    the underlying frequencies.

    '
- id: barkbase
  name: BarkBase — Canine Epigenomic Annotation
  category: reference
  species:
  - dog
  description: 'Epigenomic reference for the dog: RNA-seq, WGS and ATAC-seq across 27 adult tissues (with
    replicates) plus staged embryonic timepoints, with a download portal. Foundational for regulatory
    annotation of the canine genome.

    '
  scale: 27 adult tissues + embryonic timepoints; 37/46 ATAC-seq libraries passed QC
  modalities:
  - rna-seq
  - atac-seq
  - wgs
  formats:
  - bam
  - bigwig
  - bed
  - fastq
  landing_url: http://www.barkbase.org/
  download_url: http://www.barkbase.org/
  license: unknown (portal download; SRA raw reads public-domain norms)
  license_url: https://doi.org/10.3390/genes10060433
  access: open
  provenance:
    maintainer: Broad Institute / UMass Chan (Karlsson/Megquier)
    key_refs:
    - 10.3390/genes10060433
  last_updated: '2019'
  relevance:
    programs:
    - comparative
    - presentation
    why: 'Tissue-level regulatory annotation helps interpret expression context of tumor antigens; a baseline
      for "self" expression used in neoantigen filtering.

      '
  agent_access: 'Portal downloads + SRA raw reads (project IDs in supp. Table S1); no auth.

    '
  caveats: 'ATAC-seq quality limited (many samples FRiP <0.3, below ENCODE threshold); not ENCODE-depth.
    No MHC/immune-specific layer. License not explicitly stated.

    '
- id: caid
  name: CAID (Critical Assessment of Intrinsic Disorder)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'CASP-style blind benchmark for intrinsic disorder and disordered-binding-region prediction,
    built on community-curated DisProt annotations (plus DisProt-PDB / DisProt-Binding reference sets).
    Defines where a sequence does NOT adopt a single stable 3D structure — an important complement/caveat
    to folding models.

    '
  scale: 'CAID1: 646 proteins, 43 methods; CAID2: expanded DisProt-based sets (e.g. 210-protein NOX subset)'
  modalities:
  - sequence
  - disorder-annotation
  - predictions
  - assessment-scores
  formats:
  - fasta
  - tsv
  - caid-format
  landing_url: https://caid.idpcentral.org/
  download_url: https://caid.idpcentral.org/challenge
  api: https://disprot.org/api
  license: CC BY 4.0 (DisProt annotations)
  license_url: https://disprot.org/
  access: open
  provenance:
    maintainer: Tosatto group / DisProt consortium; OpenEBench
    key_refs:
    - 10.1038/s41592-021-01117-3
    - 10.1002/prot.26582
  last_updated: 2023 (CAID2); ongoing via OpenEBench
  relevance:
    programs:
    - design
    - presentation
    why: 'Disorder labels mark regions where sequence->single-structure assumptions break down (low-pLDDT
      regions in AFDB often coincide); useful for masking/ confidence modelling and for antigen-flexibility
      reasoning.

      '
  agent_access: 'Reference datasets and predictions downloadable from the CAID portal / OpenEBench; DisProt
    has a REST API and flat-file downloads. No auth.

    '
  caveats: 'Tangential to 3D coordinate learning (disorder, not folds) — included as a boundary/negative-signal
    resource. Datasets are small (benchmark scale). Cite DisProt/CAID.

    '
- id: cameo
  name: CAMEO (Continuous Automated Model EvaluatiOn)
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'Weekly, fully automated blind benchmark that evaluates structure (and other) prediction
    servers on soon-to-be-released PDB targets. Provides continuous, ongoing held-out assessment data
    complementing the biennial CASP.

    '
  scale: Weekly targets since 2012 (rolling archive of predictions + scores)
  modalities:
  - sequence
  - reference-structure
  - predictions
  - assessment-scores
  formats:
  - pdb
  - json
  - csv
  landing_url: https://www.cameo3d.org/
  download_url: https://www.cameo3d.org/
  license: CC BY-SA 4.0
  license_url: https://cameo3d.org/cameong_terms/
  access: open
  provenance:
    maintainer: Schwede group, SIB / Biozentrum Basel
    key_refs:
    - 10.1002/prot.25431
  last_updated: 2025 (weekly)
  relevance:
    programs:
    - design
    - presentation
