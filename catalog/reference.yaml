    mutational-signature analysis.

    '
  scale: tens of millions of coding mutations; v104+ (May 2026)
  modalities:
  - mutation-calls
  - copy-number
  - fusions
  - gene-census
  - mutational-signatures
  formats:
  - tsv
  - vcf
  - csv
  landing_url: https://cancer.sanger.ac.uk/cosmic
  download_url: https://cancer.sanger.ac.uk/cosmic/download/cosmic
  license: Custom — free for academic/non-profit (registration); commercial via QIAGEN; redistribution
    prohibited
  license_url: https://www.cosmickb.org/terms/
  access: registration
  provenance:
    maintainer: Wellcome Sanger Institute (Genome Research Limited)
    key_refs:
    - 10.1093/nar/gkad986
  last_updated: 2026 (v104, 19 May 2026; terms amended 30 Oct 2025)
  relevance:
    programs:
    - presentation
    - design
    why: 'Recurrence and driver annotation for candidate neoantigens — distinguishing recurrent hotspot
      mutations (shared-antigen opportunities) from private passengers, and sourcing curated fusion/resistance
      variants.

      '
  agent_access: 'Bulk downloads require a registered COSMIC account; files are fetched via authenticated
