- id: cath
  name: CATH / CATH-Gene3D
  category: reference
  species:
  - human
  - mouse
  - other
  description: 'Hierarchical structural classification of protein domains (Class, Architecture, Topology/fold,
    Homologous superfamily) derived from PDB, extended to sequence space via Gene3D (HMM-based assignment
    to UniProt). Provides domain boundaries, fold labels and representative/non-redundant sets used to
    build leakage-free ML train/test splits.

    '
  scale: 'v4.3.0: 500,238 classified structural domains, 5,481 superfamilies; ~151M predicted sequence
    domains (Gene3D)'
  modalities:
  - domain-classification
  - domain-boundaries
  - hmm
  - representatives
  formats:
  - tsv
  - fasta
  - pdb
  - hmm
  landing_url: https://www.cathdb.info/
  download_url: https://cathdb.info/download
  api: https://www.cathdb.info/search/by_sequence
  license: custom (Gene3D copyright; research use, no resale, attribution)
  license_url: https://cathdb.info/download
  access: open
  provenance:
    maintainer: Orengo group, UCL (Global Biodata Core Resource)
    key_refs:
    - 10.1093/nar/gkaa1079
    - 10.1093/nar/gkac1019
  last_updated: 2021 (v4.3.0); Gene3D v12 FTP
  relevance:
    programs:
    - design
    - presentation
    why: 'Standard source of fold/superfamily labels and non-redundant domain sets for structure-aware
      pretraining and for defining clustered data splits that prevent homology leakage between train and
      test.

      '
  agent_access: 'Open FTP/HTTPS bulk download and FunFam/sequence search APIs; no auth. Agent-mirrorable.

    '
  caveats: 'RED FLAG: data files are Gene3D copyright with a research-use policy that forbids resale and
    requires acknowledgement — NOT a CC licence. Confirm terms before redistribution or commercial product
    use. Classification lags PDB.

    '
