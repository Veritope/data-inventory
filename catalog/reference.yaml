  license_url: https://www.cosmickb.org/terms/
  access: registration
  provenance:
    maintainer: Wellcome Sanger Institute (Genome Research Limited)
    key_refs:
    - 10.1093/nar/gkad986
  last_updated: 2026 (v104, 19 May 2026; terms amended 30 Oct 2025)
  relevance:
    programs:
    - presentation
    - design
