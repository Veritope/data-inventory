- id: tesla-benchmark
  name: TESLA (Tumor nEoantigen SeLection Alliance) benchmark (Synapse syn21048999)
  category: functional-assay
  species:
  - human
  description: 'Consortium benchmark pairing patient tumor WES, tumor RNA-seq, and clinical-grade HLA
    typing with experimental T-cell validation of predicted epitopes — the reference dataset for benchmarking
    neoantigen prediction pipelines. Contains BOTH predicted candidates and experimentally VALIDATED immunogenicity
    (binding/immunogenicity outcomes).

    '
  scale: 6 subjects (3 metastatic melanoma, 3 NSCLC); 608 predicted epitopes experimentally assessed for
    T-cell binding
  modalities:
  - validated-neoantigen
  - predicted-neoantigen
  - functional-assay
  - mhc-binding
  formats:
  - vcf
  - fastq
  - bam
  - csv
  landing_url: https://www.synapse.org/#!Synapse:syn21048999
  download_url: https://www.synapse.org/#!Synapse:syn21048999
  license: unknown
  license_url: https://www.synapse.org/
  access: registration
  provenance:
    maintainer: Parker Institute for Cancer Immunotherapy & Cancer Research Institute (Sage Bionetworks/Synapse)
    key_refs:
    - 10.1016/j.cell.2020.09.015
  last_updated: '2020'
  relevance:
    programs:
    - recognition
    - presentation
    - design
    why: 'The canonical open benchmark tying predictions to experimental immunogenicity — directly usable
      to validate and compare Veritope''s neoantigen ranking/recognition models.

      '
  agent_access: 'Synapse requires a (free) registered account and acceptance of governance/conditions-of-use
    before download; programmatic access via synapseclient. Not anonymous bulk.

    '
  caveats: 'access: registration + Synapse governance/terms (not fully open); check conditions of use
    / any restriction. Only 6 subjects — small but deeply validated; a benchmark, not a volume source.

    '
