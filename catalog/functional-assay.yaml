- id: absolut
  name: Absolut! in silico antibody-antigen binding database
  category: functional-assay
  species:
  - human
  - mouse
  description: 'A large synthetic (in silico) antibody-antigen binding dataset: CDR-H3 sequences docked
    against lattice representations of real PDB-derived antigens with an exhaustive, deterministic binding
    energy for every pose. Designed to give unconstrained, fully-labelled ground truth for benchmarking
    antibody specificity / binding-prediction ML without experimental noise.

    '
  scale: ~159 lattice antigens; ~6.9M murine CDR-H3 sequences; on the order of ~1 billion antibody-antigen
    binding pairs
  modalities:
  - synthetic-binding
  - antibody-antigen
  - cdrh3
  - binding-energy
  formats:
  - txt
  - csv
  landing_url: https://github.com/csi-greifflab/Absolut
  download_url: https://ns9999k.webs.sigma2.no/10.11582_2021.00063/projects/NS9603K/pprobert/AbsolutOnline/
  license: unknown
  license_url: unknown
  access: open
  provenance:
    maintainer: Greiff lab (University of Oslo) and collaborators; hosted on Norstore/Sigma2
    key_refs:
    - 10.1038/s43588-022-00372-4
  last_updated: '2022'
  accessions:
  - 10.11582/2021.00063
  relevance:
    programs:
    - design
    - recognition
    why: 'Fully-labelled, noise-free antibody-antigen binding ground truth at scale — a controlled benchmark
      for the recognition models and generative-design scoring that underpin the binder program, complementing
      noisy real assays.

      '
  agent_access: 'Pre-generated files downloadable over HTTPS from the Sigma2/Norstore mirror (no auth);
    the Absolut! C++ code (csi-greifflab/Absolut) can regenerate or extend data but generation can take
    days. Large; pull selectively.

    '
  caveats: 'Explicit reuse license not clearly stated on the mirror (license: unknown) — confirm via the
    Norstore DOI before redistribution; attribute Robert et al. 2022. SYNTHETIC/lattice data — a proxy
    for real binding, useful for method development but not a substitute for experimental affinities.

    '
- id: alphaseq-sarscov2
  name: AlphaSeq antibody-antigen binding dataset (SARS-CoV-2 peptide)
  category: functional-assay
  species:
  - other
  description: 'A large quantitative antibody-antigen binding dataset: ~105,000 scFv antibody variants
    assayed by the AlphaSeq yeast mating-based platform against a SARS-CoV-2 spike HR2 peptide, giving
    sequence-resolved, replicate, predicted affinity values. Built explicitly as a public ML benchmark
    pairing antibody sequence, antigen sequence and quantitative binding.

    '
  scale: ~104,972 antibodies vs a SARS-CoV-2 peptide; affinities ~37 pM to ~22 mM; 3 phage-display seed
    sequences with ~30k variants per library set
  modalities:
  - binding-affinity
  - antibody-antigen
  - scfv
  - cdr-annotation
  formats:
  - csv
  landing_url: https://www.ll.mit.edu/partner-us/available-technologies/alphaseq-dataset-antibody-antigen-interactions-sars-cov-2
  download_url: https://www.ll.mit.edu/partner-us/available-technologies/alphaseq-dataset-antibody-antigen-interactions-sars-cov-2
  license: unknown
  license_url: unknown
  access: open
  provenance:
    maintainer: MIT Lincoln Laboratory; data from A-Alpha Bio (Engelhart et al.)
    key_refs:
    - 10.1038/s41597-022-01779-4
  last_updated: '2022'
  relevance:
    programs:
    - recognition
    - design
    why: 'One of the largest public datasets with real quantitative antibody binding affinities tied to
      sequence — a direct supervised benchmark for the recognition/affinity-prediction models behind binder
      design.

      '
  agent_access: 'Two public releases hosted by MIT Lincoln Laboratory (Dataset 1: original AlphaSeq set;
    Dataset 2: ML-designed antibodies measured experimentally). CSV with sequences, CDRs, replicate IDs
    and log-scale nM affinity. Download via the MIT LL page.

    '
  caveats: 'Each release subdirectory carries its own license (overall license: unknown until checked
    per subdir) — read before reuse; attribute Engelhart et al. 2022. Affinities are platform-predicted
    (AlphaSeq), replicate-averaged; blanks denote poor/non-binders. Single antigen (SARS-CoV-2 HR2 peptide).

    '
