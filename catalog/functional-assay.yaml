- id: ab-bind
  name: AB-Bind (antibody binding mutational database)
  category: functional-assay
  species:
  - human
  - mouse
  - other
  description: 'Curated set of experimental binding free-energy changes (ddG) for point and multiple mutations
    in antibody-antigen (and related) complexes, each mapped to a solved PDB structure. Built as a benchmark
    for computational affinity- change prediction.

    '
  scale: 1,101 mutational variants across 32 antibody-antigen complexes, each with measured ddG
  modalities:
  - binding-affinity
  - ddg
  - mutation
  - complex-structure
  formats:
  - csv
  - xlsx
  landing_url: https://onlinelibrary.wiley.com/doi/10.1002/pro.2829
  download_url: https://onlinelibrary.wiley.com/doi/10.1002/pro.2829
  license: unknown
  license_url: https://onlinelibrary.wiley.com/doi/10.1002/pro.2829
  access: open
  provenance:
    maintainer: Keating Lab, MIT (Sirin, Apgar, Bennett, Keating)
    key_refs:
    - 10.1002/pro.2829
  last_updated: '2016'
  relevance:
    programs:
    - design
    why: 'A focused antibody-antigen ddG benchmark for affinity-maturation / binder-optimization models
      — smaller and more antibody-specific than SKEMPI, and routinely paired with it for evaluation.

      '
  agent_access: 'Dataset lives in the Protein Science article''s supplementary files; copies are widely
    mirrored on GitHub by reusers. No API; fetch the SI tables.

    '
  caveats: 'No explicit data license on the SI (mark unknown; confirm before redistribution). Small and
    well-trodden — risk of train/test leakage with SKEMPI 2.0 (overlapping complexes). Some entries are
    non-antibody PPIs.

    '
