- id: flab
  name: FLAb — Fitness Landscapes for Antibodies (developability benchmark)
  category: functional-assay
  species:
  - human
  - mouse
  description: 'A living benchmark aggregating experimentally measured therapeutic-antibody "fitness"/developability
    properties (e.g. binding affinity, thermostability, expression, aggregation, polyreactivity, viscosity,
    immunogenicity) across many published studies, with scoring scripts to test whether protein/antibody
    AI models can predict these properties.

    '
  scale: 'FLAb2 (2025): developability data for >4M antibodies across 32 studies, 7 properties (FLAb v1
    covered 6 properties)'
  modalities:
  - developability
  - binding-affinity
  - thermostability
  - expression
  - polyreactivity
  - antibody-sequence
  formats:
  - csv
  landing_url: https://github.com/Graylab/FLAb
  download_url: https://github.com/Graylab/FLAb
  license: CC BY 4.0
  license_url: https://registry.opendata.aws/flab/
  access: open
  provenance:
    maintainer: Gray lab, Johns Hopkins University
    key_refs:
    - 10.1101/2024.01.13.575504
    - 10.64898/2025.12.27.696706
  last_updated: '2025'
  relevance:
    programs:
    - design
    why: 'Developability is the make-or-break constraint for the binder-design program. FLAb is the central
      public benchmark of measured antibody properties for training and honestly evaluating developability
      predictors.

      '
  agent_access: 'GitHub repo with datasets under data/ (organised by property) and scoring scripts under
    models/; also mirrored on the AWS Open Data Registry. No auth; clone/download directly. Per-dataset
    licenses listed in data/README.md.

    '
  caveats: 'Aggregate license given as CC BY 4.0 (AWS Open Data Registry), but individual constituent
    datasets have their own licenses listed in data/README.md — check per dataset before redistribution.
    Properties/assays are heterogeneous across source studies; FLAb2 itself reports current AI models
    fail to predict most (~80%) developability datasets, so treat as a hard benchmark.

    '
